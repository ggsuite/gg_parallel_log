# Runs the tests on Linux, macOS and Windows and drives the interactive view
# in a real terminal on Linux and macOS.

name: Platforms

on:
  push:
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - run: dart analyze
      - run: dart test

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tmux
      - name: Drive the interactive view
        if: runner.os != 'Windows'
        run: bash tool/interactive_smoke_test.sh
