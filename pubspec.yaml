name: gg_parallel_log
description: "Interactive CLI logger for parallel processes: inline overview, fullscreen lane details, error filter, search, cancel and a plain fallback."
version: 0.0.1
repository: https://github.com/ggsuite/gg_parallel_log.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  clock: ^1.1.2
  gg_console_colors: ^2.5.0
  gg_is_github: ^1.2.3
  gg_log: ^1.2.0
  gg_status_printer: ^1.6.3
  meta: ^1.18.3
  path: ^1.9.1

dev_dependencies:
  dna_ggsuite: ^0.5.0
  fake_async: ^1.3.3
  helix: ^1.13.0
  lints: ^6.1.0
  test: ^1.33.0
